name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build & Test Frontend
        working-directory: web
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Copy Embedded Dist
        run: |
          rm -rf internal/server/dist
          cp -r web/dist internal/server/dist

      - name: Go Vet & Race Tests
        run: |
          go vet ./...
          go test -v -race ./...

      - name: Build Binary
        run: |
          go build -trimpath -ldflags="-s -w" -o bin/container-land ./cmd/container-land
